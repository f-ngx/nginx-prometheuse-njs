#
# Тестовая конфигурация: только для Docker-образа и проверки модуля.
# Подключение к существующему nginx описано в README.
#
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 5;
  types_hash_max_size 2048;

  # Путь к njs скриптам
  js_path "/etc/nginx/src/";

  server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Импорт njs модуля: default export - обработчик метрик
    js_import metrics from metrics.js;

    # Проверка, что nginx поднялся
    location / {
      default_type text/plain;
      return 200 "Nginx with njs metrics exporter\n";
    }

    # Метрики Prometheus. В проде закрыть через auth_basic или allow/deny
    location = /metrics {
      access_log off;
      js_content metrics;
    }

    # Источник для subrequest из metrics.js. internal: снаружи недоступен,
    # subrequest из njs - внутренний запрос, ему internal не мешает
    location = /stub_status {
      internal;
      stub_status;
      access_log off;
    }
  }
}
