#
# Тестовая конфигурация
#
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 5;
  types_hash_max_size 2048;

  # Путь к njs скриптам
  js_path "/etc/nginx/src/";
  
  server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Импорт njs модуля
    js_import metrics from metrics.js;

    # Корневой location для проверки работы
    location / {
      return 200 "Nginx with njs metrics exporter\n";
      add_header Content-Type text/plain;
    }

    # Prometheus metrics endpoint
    location /v1/metrics {
      js_content metrics;
    }

    # Stub status для сбора метрик (внутренний endpoint)
    # See: https://nginx.org/en/docs/http/ngx_http_stub_status_module.html
    # Доступ открыт для subrequest из njs скрипта
    location /v1/stub_status {
      stub_status;
      access_log off;
    }
  }
}
